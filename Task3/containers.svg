<svg xmlns="http://www.w3.org/2000/svg" width="2580" height="1850" viewBox="0 0 2580 1850"><rect width="100%" height="100%" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text x="30" y="43" text-anchor="start" font-family="Arial, sans-serif" font-size="26" fill="#0f172a"><tspan x="30" dy="0">ADR-001 · C4 Containers · интернет-банк и АБС</tspan></text><text x="30" y="78" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#0f172a"><tspan x="30" dy="0">Новые Java-сервисы совместимы с Kafka; старый ASP.NET-монолит работает с ними по HTTPS. Legacy-платежи остаются отдельно.</tspan></text><rect x="40" y="270" width="1280" height="1130" fill="#f8fafc" stroke="#64748b" stroke-dasharray="8 5" /><text x="52" y="297" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="52" dy="0">Интернет-банк и новое депозитное расширение [Software System]</tspan></text><rect x="1710" y="270" width="820" height="1130" fill="#f8fafc" stroke="#64748b" stroke-dasharray="8 5" /><text x="1722" y="297" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="1722" dy="0">АБС [Software System]</tspan></text><polyline points="220.0,230 220.0,290.0 260.0,290.0 260.0,350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="122.0" y="267.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="240.0" y="282.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="240.0" dy="0">UC3/4/7: HTTPS</tspan></text><polyline points="260.0,495 260.0,607.5 260.0,607.5 260.0,720" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="132" y="605" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="250" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="250" dy="0">SQL: прежние функции</tspan></text><polyline points="430,422.5 505.0,422.5 505.0,430.0 580,430.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="387.0" y="403.25" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="505.0" y="418.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="505.0" dy="0">UC3/4/7: HTTPS REST</tspan><tspan x="505.0" dy="16.900000000000002">Доверенная идентичность</tspan></text><polyline points="770.0,510 770.0,615.0 770.0,615.0 770.0,720" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="652.0" y="592.0" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="770.0" y="607.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="770.0" dy="0">SQL: заявка + outbox атомарно</tspan></text><polyline points="960,455 1040,455 1040,1105 960,1105" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="942" y="965" width="236" height="56" rx="3" fill="white" opacity=".96" /><text x="1060" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1060" dy="0">UC4: создать / проверить OTP</tspan><tspan x="1060" dy="16.900000000000002">HTTPS</tspan></text><polyline points="580,1105.0 505.0,1105.0 505.0,1115.0 430,1115.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="387.0" y="1087.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="505.0" y="1102.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="505.0" dy="0">SQL: challenge / задания</tspan></text><polyline points="700,1180 700,1440 225,1440 225,1510" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="352" y="1415" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="470" y="1430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="470" dy="0">UC4/5/6: отправка СМС</tspan><tspan x="470" dy="16.900000000000002">HTTPS</tspan></text><polyline points="960,400 1520,400 1520,680" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1092" y="375" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="1210" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1210" dy="0">UC2/4: publish команды / лиды</tspan></text><polyline points="1390,740 1180,740 1180,485 960,485" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1062" y="595" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="1180" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1180" dy="0">UC1/5/6: consume ставки /</tspan><tspan x="1180" dy="16.900000000000002">статусы</tspan></text><polyline points="1520,870 1520,1230 770,1230 770,1180" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1122" y="1205" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1240" y="1220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1240" dy="0">UC5/6: уведомления</tspan></text><polyline points="1650,775.0 1720.0,775.0 1720.0,740.0 1790,740.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1602" y="675" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1720" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1720" dy="0">UC4: команды</tspan></text><polyline points="1960,820 1960,920 1520,920 1520,870" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1632" y="895" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1750" y="910" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1750" dy="0">UC1/5/6: ставки / статусы</tspan></text><polyline points="2130,740.0 2130.0,740.0 2130.0,1077.5 2130,1077.5" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1842" y="1045" width="236" height="56" rx="3" fill="white" opacity=".96" /><text x="1960" y="1060" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1960" dy="0">PL-SQL: ограниченный</tspan><tspan x="1960" dy="16.900000000000002">интерфейс</tspan><tspan x="1960" dy="16.900000000000002">UC1/5/6 + inbox/outbox</tspan></text><polyline points="2305.0,240 2305.0,295.0 2290.0,295.0 2290.0,350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="2179.5" y="272.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="2297.5" y="287.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="2297.5" dy="0">UC1/5/6: ставки / открытие</tspan></text><polyline points="2470,425 2500,425 2500,1075 2470,1075" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="2272" y="835" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="2390" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="2390" dy="0">Ролевые PL-SQL процедуры</tspan></text><polyline points="755,1510 1280,1510 1280,600 900,600 900,510" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1142" y="1335" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1260" y="1350" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1260" dy="0">UC2: HTTPS каталог / лид</tspan></text><polyline points="1570,870 1570,1510" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1462" y="1335" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1580" y="1350" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1580" dy="0">UC2: deposit.leads</tspan></text><rect x="70" y="130" width="300" height="100" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="220.0" y="175.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="220.0" dy="0">Клиент интернет-банка</tspan><tspan x="220.0" dy="20.8">[Person]</tspan></text><rect x="90" y="350" width="340" height="145" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="260.0" y="407.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="260.0" dy="0">Web / legacy-монолит</tspan><tspan x="260.0" dy="20.8">[Container: ASP.NET MVC 4.5]</tspan><tspan x="260.0" dy="20.8">Вход, платежи, новые экраны</tspan></text><rect x="90" y="720" width="340" height="130" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="260.0" y="769.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="260.0" dy="0">Legacy DB</tspan><tspan x="260.0" dy="20.8">[Container: MS SQL]</tspan><tspan x="260.0" dy="20.8">Данные интернет-банка</tspan></text><rect x="580" y="350" width="380" height="160" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="770.0" y="414.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="770.0" dy="0">Сервис депозитов</tspan><tspan x="770.0" dy="20.8">[Container: Java Spring Boot]</tspan><tspan x="770.0" dy="20.8">Каталог, заявки, статусы; outbox relay</tspan></text><rect x="580" y="720" width="380" height="145" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="770.0" y="777.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="770.0" dy="0">Deposits DB</tspan><tspan x="770.0" dy="20.8">[Container: MS SQL]</tspan><tspan x="770.0" dy="20.8">Read-модель, заявки, outbox</tspan></text><rect x="580" y="1030" width="380" height="150" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="770.0" y="1089.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="770.0" dy="0">Подтверждения и уведомления</tspan><tspan x="770.0" dy="20.8">[Container: Java Spring Boot]</tspan><tspan x="770.0" dy="20.8">OTP и задания СМС</tspan></text><rect x="90" y="1050" width="340" height="130" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="260.0" y="1099.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="260.0" dy="0">Notifications DB</tspan><tspan x="260.0" dy="20.8">[Container: MS SQL]</tspan><tspan x="260.0" dy="20.8">Challenge, повторы доставки</tspan></text><rect x="1390" y="680" width="260" height="190" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="1520.0" y="739.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1520.0" dy="0">Kafka</tspan><tspan x="1520.0" dy="20.8">[Container: message</tspan><tspan x="1520.0" dy="20.8">broker]</tspan><tspan x="1520.0" dy="20.8">commands / status / rates</tspan><tspan x="1520.0" dy="20.8">/ leads / notifications</tspan></text><rect x="1790" y="660" width="340" height="160" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="1960.0" y="724.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1960.0" dy="0">Адаптер АБС</tspan><tspan x="1960.0" dy="20.8">[Container: Java Spring Boot]</tspan><tspan x="1960.0" dy="20.8">Kafka ↔ inbox/outbox; лимиты</tspan></text><rect x="2130" y="990" width="340" height="175" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="2300.0" y="1041.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="2300.0" dy="0">Oracle / PL-SQL</tspan><tspan x="2300.0" dy="20.8">[Container: database + business</tspan><tspan x="2300.0" dy="20.8">logic]</tspan><tspan x="2300.0" dy="20.8">Ставки, счета, договоры,</tspan><tspan x="2300.0" dy="20.8">inbox/outbox</tspan></text><rect x="2110" y="350" width="360" height="150" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="2290.0" y="409.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="2290.0" dy="0">Рабочие места АБС</tspan><tspan x="2290.0" dy="20.8">[Container: Delphi]</tspan><tspan x="2290.0" dy="20.8">Ролевой UI бэк-/фронт-офиса</tspan></text><rect x="2130" y="130" width="350" height="110" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="2305.0" y="169.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="2305.0" dy="0">Бэк-офисы и фронт-офис</tspan><tspan x="2305.0" dy="20.8">[Person]</tspan><tspan x="2305.0" dy="20.8">Разделённые полномочия</tspan></text><rect x="570" y="1510" width="370" height="130" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="755.0" y="1559.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="755.0" dy="0">Сайт</tspan><tspan x="755.0" dy="20.8">[External System: PHP/React]</tspan><tspan x="755.0" dy="20.8">Публичные ставки / лиды</tspan></text><rect x="1370" y="1510" width="370" height="130" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="1555.0" y="1559.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1555.0" dy="0">Система кол-центра</tspan><tspan x="1555.0" dy="20.8">[External System: Java/React/PG]</tspan><tspan x="1555.0" dy="20.8">Получает лиды, звонит</tspan></text><rect x="50" y="1510" width="350" height="130" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="225.0" y="1559.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="225.0" dy="0">СМС-шлюз → оператор</tspan><tspan x="225.0" dy="20.8">[External System]</tspan><tspan x="225.0" dy="20.8">Доставка клиенту</tspan></text><rect x="50" y="1690" width="2480" height="130" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" /><text x="1290.0" y="1739.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1290.0" dy="0">Legacy: ASP.NET → Oracle для платежей и текущих счетов сохраняется, но не используется для новых депозитов.</tspan><tspan x="1290.0" dy="20.8">Стрелки Kafka показывают логическое направление данных; подтверждения доставки подразумеваются.</tspan><tspan x="1290.0" dy="20.8">Два ЦОД: stateless-экземпляры + HA/DR БД; принятые команды восстанавливаются из outbox, consumer'ы идемпотентны.</tspan></text></svg>