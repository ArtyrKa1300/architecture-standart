<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1320" viewBox="0 0 2240 1320"><rect width="100%" height="100%" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text x="30" y="43" text-anchor="start" font-family="Arial, sans-serif" font-size="26" fill="#0f172a"><tspan x="30" dy="0">ADR-002 · C4 Containers · границы передачи ставок</tspan></text><text x="30" y="78" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#0f172a"><tspan x="30" dy="0">Сервис депозитов раскрыт на компоненты на следующем листе. SFTP и система партнёра находятся за отдельными границами доступа.</tspan></text><rect x="600" y="300" width="720" height="720" fill="#f8fafc" stroke="#64748b" stroke-dasharray="8 5" /><text x="612" y="327" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="612" dy="0">Депозитное расширение интернет-банка [Software System]</tspan></text><polyline points="410,230.0 520.0,230.0 520.0,215.0 630,215.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="402.0" y="199.5" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="520.0" y="214.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="520.0" dy="0">CC-UC1: публикация</tspan></text><polyline points="795.0,270 795.0,340.0 930.0,340.0 930.0,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="744.5" y="317.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="862.5" y="332.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="862.5" dy="0">CC-UC1: consume rates</tspan></text><polyline points="930.0,580 930.0,675.0 930.0,675.0 930.0,770" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="812.0" y="652.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="930.0" y="667.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="930.0" dy="0">SQL: snapshot / lease / ACK</tspan></text><polyline points="1650,230.0 1425.0,230.0 1425.0,495.0 1200,495.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1332" y="375" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1450" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1450" dy="0">CC-UC2: HTTPS API</tspan></text><polyline points="1200,495.0 1425.0,495.0 1425.0,695.0 1650,695.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1332" y="655" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1450" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1450" dy="0">CC-UC3/5: upload / read ACK</tspan></text><polyline points="1880.0,770 1880.0,915.0 1880.0,915.0 1880.0,1060" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1782" y="935" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1900" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1900" dy="0">CC-UC3: download файлов</tspan></text><polyline points="2110,1130 2180,1130 2180,690 2110,690" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1962" y="835" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="2080" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="2080" dy="0">CC-UC3/5: upload ACK</tspan></text><rect x="60" y="160" width="350" height="140" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="235.0" y="214.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="235.0" dy="0">АБС + адаптер</tspan><tspan x="235.0" dy="20.8">[External System]</tspan><tspan x="235.0" dy="20.8">Approved-ставки</tspan></text><rect x="630" y="160" width="330" height="110" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="795.0" y="199.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="795.0" dy="0">Kafka</tspan><tspan x="795.0" dy="20.8">[Container: message broker]</tspan><tspan x="795.0" dy="20.8">deposit.rates</tspan></text><rect x="660" y="410" width="540" height="170" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="930.0" y="479.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="930.0" dy="0">Сервис депозитов</tspan><tspan x="930.0" dy="20.8">[Container: Java Spring Boot]</tspan><tspan x="930.0" dy="20.8">Public API + projection + exporter</tspan></text><rect x="660" y="770" width="540" height="150" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="930.0" y="829.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="930.0" dy="0">Deposits DB</tspan><tspan x="930.0" dy="20.8">[Container: MS SQL]</tspan><tspan x="930.0" dy="20.8">Публичная проекция, версия, журнал экспорта</tspan></text><rect x="1650" y="160" width="460" height="140" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="1880.0" y="214.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1880.0" dy="0">Система кол-центра</tspan><tspan x="1880.0" dy="20.8">[External System]</tspan><tspan x="1880.0" dy="20.8">Backend + экран ставок</tspan></text><rect x="1650" y="620" width="460" height="150" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="1880.0" y="679.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1880.0" dy="0">SFTP-server</tspan><tspan x="1880.0" dy="20.8">[Container: SSH/SFTP]</tspan><tspan x="1880.0" dy="20.8">Публикации / ACK, DMZ</tspan></text><rect x="1650" y="1060" width="460" height="150" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="1880.0" y="1119.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1880.0" dy="0">Система партнёра</tspan><tspan x="1880.0" dy="20.8">[External System]</tspan><tspan x="1880.0" dy="20.8">Импорт + локальный каталог + UI</tspan></text><rect x="60" y="1130" width="1280" height="130" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" /><text x="700.0" y="1190.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="700.0" dy="0">Компоненты projection/API/exporter разделены логически внутри одного Java-контейнера,</tspan><tspan x="700.0" dy="20.8">не объявляются тремя независимыми микросервисами. Доступ к данным клиентов для SFTP-пользователя отсутствует.</tspan></text></svg>