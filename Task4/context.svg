<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="1240" viewBox="0 0 2110 1240"><rect width="100%" height="100%" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text x="30" y="43" text-anchor="start" font-family="Arial, sans-serif" font-size="26" fill="#0f172a"><tspan x="30" dy="0">ADR-002 · C4 Context · ставки для кол-центров</tspan></text><text x="30" y="78" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#0f172a"><tspan x="30" dy="0">Показаны только изменения передачи ставок. Общий каталог переиспользуется из ADR-001. Персональные данные партнёру не передаются.</tspan></text><polyline points="245.0,270 245.0,380.0 245.0,380.0 245.0,490" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="127.0" y="357.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="245.0" y="372.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="245.0" dy="0">CC-UC1: согласование</tspan></text><polyline points="430,565.0 565.0,565.0 565.0,570.0 700,570.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="447.0" y="544.5" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="565.0" y="559.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="565.0" dy="0">CC-UC1: версии ставок</tspan><tspan x="565.0" dy="16.900000000000002">адаптер + Kafka</tspan></text><polyline points="1070,210.0 1290.0,210.0 1290.0,225.0 1510,225.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1172.0" y="194.5" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1290.0" y="209.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1290.0" dy="0">CC-UC2: консультация</tspan></text><polyline points="1510,225.0 1320.0,225.0 1320.0,570.0 1130,570.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1232" y="395" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="1350" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1350" dy="0">CC-UC2: HTTPS API</tspan><tspan x="1350" dy="16.900000000000002">только общие ставки</tspan></text><polyline points="915.0,650 915.0,800.0 915.0,800.0 915.0,950" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="797.0" y="777.0" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="915.0" y="792.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="915.0" dy="0">CC-UC3: публикация файлов</tspan><tspan x="915.0" dy="16.900000000000002">CC-UC5: проверка ACK</tspan></text><polyline points="1130,1025.0 1320.0,1025.0 1320.0,1025.0 1510,1025.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1202.0" y="1002.0" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="1320.0" y="1017.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1320.0" dy="0">CC-UC3: SFTP download</tspan><tspan x="1320.0" dy="16.900000000000002">CSV + manifest</tspan></text><polyline points="1745,1100 1745,1160 915,1160 915,1100" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1232" y="1135" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1350" y="1150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1350" dy="0">CC-UC3/5: ACK</tspan></text><polyline points="1720.0,650 1720.0,800.0 1745.0,800.0 1745.0,950" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1614.5" y="777.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1732.5" y="792.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1732.5" dy="0">CC-UC4: локальные ставки</tspan></text><rect x="60" y="150" width="370" height="120" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="245.0" y="205.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="245.0" dy="0">Кредитный / депозитный бэк-офис</tspan><tspan x="245.0" dy="20.8">[Person]</tspan></text><rect x="60" y="490" width="370" height="150" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="245.0" y="549.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="245.0" dy="0">АБС</tspan><tspan x="245.0" dy="20.8">[Software System]</tspan><tspan x="245.0" dy="20.8">Утверждает версии ставок</tspan></text><rect x="700" y="490" width="430" height="160" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="915.0" y="554.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="915.0" dy="0">Депозитное расширение интернет-банка</tspan><tspan x="915.0" dy="20.8">[Software System]</tspan><tspan x="915.0" dy="20.8">Публичные ставки и выгрузка</tspan></text><rect x="1510" y="150" width="420" height="150" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="1720.0" y="209.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1720.0" dy="0">Система кол-центра банка</tspan><tspan x="1720.0" dy="20.8">[Software System]</tspan><tspan x="1720.0" dy="20.8">Показывает актуальную версию</tspan></text><rect x="700" y="150" width="370" height="120" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="885.0" y="205.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="885.0" dy="0">Оператор банка</tspan><tspan x="885.0" dy="20.8">[Person]</tspan></t