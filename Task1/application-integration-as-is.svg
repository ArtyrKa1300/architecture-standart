<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="1620" viewBox="0 0 2340 1620"><rect width="100%" height="100%" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text x="30" y="43" text-anchor="start" font-family="Arial, sans-serif" font-size="26" fill="#0f172a"><tspan x="30" dy="0">Банк «Стандарт»: интеграция приложений AS-IS</tspan></text><text x="30" y="78" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#0f172a"><tspan x="30" dy="0">Только текущее состояние. Сплошные стрелки: направление запросов/данных; ответы подразумеваются. Почта и Excel — часть ручного процесса.</tspan></text><polyline points="320,197.5 390.0,197.5 390.0,197.5 460,197.5" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="272.0" y="174.5" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="390.0" y="189.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="390.0" dy="0">Просмотр сайта</tspan></text><polyline points="320,457.5 390.0,457.5 390.0,457.5 460,457.5" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="272.0" y="434.5" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="390.0" y="449.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="390.0" dy="0">Платежи / текущие счета</tspan></text><polyline points="720,457.5 870.0,457.5 870.0,470.0 1020,470.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="752.0" y="440.75" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="870.0" y="455.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="870.0" dy="0">Прямой доступ к БД АБС</tspan><tspan x="870.0" dy="16.900000000000002">Существующая интеграция</tspan></text><polyline points="1730.0,255 1730.0,327.5 1750.0,327.5 1750.0,400" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1622.0" y="304.5" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1740.0" y="319.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1740.0" dy="0">Создаёт обращение</tspan></text><polyline points="1600,470.0 1480.0,470.0 1480.0,470.0 1360,470.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1362.0" y="447.0" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="1480.0" y="462.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1480.0" dy="0">Передаёт заявку</tspan><tspan x="1480.0" dy="16.900000000000002">Транспорт не задан</tspan></text><polyline points="740,817.5 880.0,817.5 880.0,815.0 1020,815.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="762.0" y="793.25" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="880.0" y="808.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="880.0" dy="0">Открывает, загружает</tspan><tspan x="880.0" dy="16.900000000000002">документы</tspan></text><polyline points="1190.0,750 1190.0,645.0 1190.0,645.0 1190.0,540" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1072.0" y="622.0" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1190.0" y="637.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1190.0" dy="0">Вызов PL-SQL / данные</tspan></text><polyline points="1150.0,1110 1150.0,995.0 1190.0,995.0 1190.0,880" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1052.0" y="972.0" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="1170.0" y="987.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1170.0" dy="0">Заявки / подтверждённая</tspan><tspan x="1170.0" dy="16.900000000000002">ставка</tspan></text><polyline points="1600,1167 1460,1167 1460,815 1360,815" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1342" y="945" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="1460" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1460" dy="0">Риск: своя область доступа</tspan></text><polyline points="610.0,875 610.0,992.5 630.0,992.5 630.0,1110" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="502.0" y="969.5" width="236" height="22" rx="3" fill="white" opacity=".96" /><text x="620.0" y="984.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="620.0" dy="0">Запрос ставки</tspan></text><polyline points="1020,1167.5 900.0,1167.5 900.0,1180.0 780,1180.0" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="782.0" y="1150.75" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="900.0" y="1165.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="900.0" dy="0">Запрос риска / ставка</tspan><tspan x="900.0" dy="16.900000000000002">отделению</tspan></text><polyline points="1730,1225 1730,1330 630,1330 630,1250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="1082" y="1305" width="236" height="39" rx="3" fill="white" opacity=".96" /><text x="1200" y="1320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a"><tspan x="1200" dy="0">Excel ежедневно / результат</tspan><tspan x="1200" dy="16.900000000000002">риска</tspan></text><polyline points="1190.0,400 1190.0,327.5 1170.0,327.5 1170.0,255" fill="none" stroke="#475569" stroke-width="1.8" marker-en