an><tspan x="190.0" dy="20.8">[Person]</tspan></text><rect x="460" y="400" width="260" height="115" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="590.0" y="431.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="590.0" dy="0">Интернет-банк</tspan><tspan x="590.0" dy="20.8">[System: ASP.NET / MS</tspan><tspan x="590.0" dy="20.8">SQL]</tspan><tspan x="590.0" dy="20.8">Платежи, текущие счета</tspan></text><rect x="1020" y="400" width="340" height="140" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="1190.0" y="454.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1190.0" dy="0">АБС: Oracle / PL-SQL</tspan><tspan x="1190.0" dy="20.8">[System storage]</tspan><tspan x="1190.0" dy="20.8">Счета, заявки, договоры</tspan></text><rect x="1020" y="750" width="340" height="130" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="1190.0" y="799.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1190.0" dy="0">АБС: клиент Delphi</tspan><tspan x="1190.0" dy="20.8">[Application]</tspan><tspan x="1190.0" dy="20.8">Ролевые рабочие места</tspan></text><rect x="480" y="760" width="260" height="115" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="610.0" y="802.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="610.0" dy="0">Фронт-офис</tspan><tspan x="610.0" dy="20.8">[Person]</tspan><tspan x="610.0" dy="20.8">Идентификация, договор</tspan></text><rect x="1020" y="1110" width="260" height="115" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="1150.0" y="1152.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1150.0" dy="0">Депозитный бэк-офис</tspan><tspan x="1150.0" dy="20.8">[Person]</tspan><tspan x="1150.0" dy="20.8">Согласует ставку</tspan></text><rect x="1600" y="1110" width="260" height="115" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="1730.0" y="1152.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1730.0" dy="0">Кредитный бэк-офис</tspan><tspan x="1730.0" dy="20.8">[Person]</tspan><tspan x="1730.0" dy="20.8">Риск и расчёт ставки</tspan></text><rect x="480" y="1110" width="300" height="140" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="630.0" y="1164.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="630.0" dy="0">Excel и почта</tspan><tspan x="630.0" dy="20.8">[Рабочие инструменты]</tspan><tspan x="630.0" dy="20.8">Ставки, запросы, результаты</tspan></text><rect x="1600" y="140" width="260" height="115" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="1730.0" y="192.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1730.0" dy="0">Оператор банка</tspan><tspan x="1730.0" dy="20.8">[Person]</tspan></text><rect x="1600" y="400" width="300" height="140" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="1750.0" y="454.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1750.0" dy="0">Система кол-центра</tspan><tspan x="1750.0" dy="20.8">[System: React / Java / PG]</tspan><tspan x="1750.0" dy="20.8">Обращения</tspan></text><rect x="1020" y="140" width="300" height="115" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="1170.0" y="182.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1170.0" dy="0">СМС-шлюз</tspan><tspan x="1170.0" dy="20.8">[System]</tspan><tspan x="1170.0" dy="20.8">Поддержка IT банка</tspan></text><rect x="1980" y="140" width="300" height="130" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="2130.0" y="189.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="2130.0" dy="0">Телеком-оператор</tspan><tspan x="2130.0" dy="20.8">[External System]</tspan><tspan x="2130.0" dy="20.8">Доставка СМС клиенту</tspan></text><rect x="1980" y="760" width="300" height="140" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="2130.0" y="814.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="2130.0" dy="0">Партнёрский кол-центр</tspan><tspan x="2130.0" dy="20.8">[External System]</tspan><tspan x="2130.0" dy="20.8">Операторы в своей системе</tspan></text><rect x="1600" y="760" width="300" height="130" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" /><text x="1750.0" y="809.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1750.0" dy="0">Бизнес-представители</tspan><tspan x="1750.0" dy="20.8">[Person]</tspan><tspan x="1750.0" dy="20.8">Передают скрипты звонков</tspan></text><rect x="50" y="1420" width="2230" height="140" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" /><text x="1165.0" y="1474.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="1165.0" dy="0">Клиент приходит в отделение и подтверждает условия; фронт-офис выдаёт и загружает подписанные документы.</tspan><tspan x="1165.0" dy="20.8">Обычно ожидание 20 минут, особая ставка — до часа. Бэк-офисы не получают доступ к исходным данным друг друга.</tspan><tspan x="1165.0" dy="20.8">Новые Kafka-сервисы и автоматическая передача ставок партнёру здесь отсутствуют.</tspan></text></svg>